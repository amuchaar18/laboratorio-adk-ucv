[tool.poetry]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Mono-agente básico utilizando Google ADK"
authors = ["Alumno UCV"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
google-adk = "*"
python-dotenv = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
